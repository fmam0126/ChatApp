events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip WASM/DLL framework payloads ──
    gzip on;
    gzip_types    text/plain text/css application/json application/javascript
                  application/wasm application/octet-stream
                  text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # ── Cache duration by content type (fingerprinted assets → aggressive) ──
    map $sent_http_content_type $cache_max_age {
        default                          0;
        ~application/wasm                365d;
        ~application/octet-stream        365d;
        ~application/javascript          365d;
        ~text/css                        365d;
        ~image/                          30d;
        ~font/                           365d;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Blazor framework files (content-hashed, cache forever) ──
        location /_framework/ {
            add_header Cache-Control $cache_max_age;
            expires max;
            try_files $uri =404;
        }

        # ── BlazorWinOld / third-party static assets ──
        location /_content/ {
            add_header Cache-Control $cache_max_age;
            expires max;
            try_files $uri =404;
        }

        # ── Static assets with cache headers ──
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control $cache_max_age;
            expires max;
            try_files $uri =404;
        }

        # ── SPA fallback: client-side routes serve index.html ──
        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}
