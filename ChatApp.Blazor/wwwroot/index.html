<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ChatApp.Blazor.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <link href="_content/BlazorWinOld/css/blazorwinold.css" rel="stylesheet" />
    <style>
        /* Win95 loading screen — shown while Blazor WASM boots */
        .win95-loading {
            width: 100vw;
            height: 100vh;
            background-color: #008080;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Geneva, sans-serif;
            font-size: 12px;
        }
        .win95-loading-window {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #0a0a0a;
            width: 300px;
        }
        .win95-loading .win95-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            font-weight: bold;
            font-size: 12px;
            padding: 3px 6px;
            display: flex;
            align-items: center;
        }
        .win95-loading-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .win95-loading-body p {
            margin: 0;
            text-align: center;
            font-size: 12px;
        }
        .win95-progress-bar {
            height: 18px;
            background-color: #ffffff;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 2px;
            overflow: hidden;
        }
        .win95-progress-fill {
            height: 100%;
            background: #000080;
            width: 0%;
            animation: win95-progress 2.5s ease-in-out infinite;
        }
        @keyframes win95-progress {
            0% { width: 0%; margin-left: 0; }
            50% { width: 70%; margin-left: 0; }
            90% { width: 15%; margin-left: 85%; }
            100% { width: 0%; margin-left: 100%; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="win95-loading">
            <div class="win95-loading-window">
                <div class="win95-titlebar">
                    <span>ChatApp</span>
                </div>
                <div class="win95-loading-body">
                    <p>Loading, please wait...</p>
                    <div class="win95-progress-bar">
                        <div class="win95-progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/desktop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
