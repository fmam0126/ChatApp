# Traefik static configuration — dynamic routing configured via Docker labels on services

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    network: chatapp-network

# Enable access logs for debugging
accessLog: {}
